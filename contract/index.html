<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Contract</title><style>*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4f4f2;color:#262626;font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center;margin:8px 0 22px}
.eyebrow{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7a7a7a}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:650}
h2{font-size:17px;margin:22px 0 4px;font-weight:650}
.card h2:first-child{margin-top:0;font-size:20px}
p{margin:0 0 10px}
.muted{color:#777}
.card{background:#fff;border-radius:18px;padding:22px 20px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.center{text-align:center}
.facts{display:flex;gap:12px;padding:16px 20px}
.facts div{flex:1;display:flex;flex-direction:column;text-align:center}
.facts span{font-size:13px}.facts strong{font-size:18px;font-weight:650}
.contract{font-size:16px}
.contract ul{padding-left:20px;margin:0 0 10px}.contract li{margin-bottom:6px}
.contract h2:first-child{margin-top:0}
.link{color:#555;text-decoration:underline;text-underline-offset:3px;font-size:15px}
label{display:block;font-size:15px;font-weight:600;margin:0 0 16px;color:#333}
.req,.opt{font-weight:400;font-size:13px;color:#8a8a8a;margin-left:6px}
input[type=text],textarea{display:block;width:100%;margin-top:7px;padding:14px 14px;font:inherit;font-weight:400;color:#222;background:#f3f3f1;border:0;border-radius:12px;outline:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.06);-webkit-appearance:none;appearance:none}
textarea{resize:vertical}
input[type=text]:focus,textarea:focus{background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.08)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.check{display:flex;align-items:flex-start;gap:12px;font-weight:500;cursor:pointer;margin:6px 0 14px;position:relative}
.check input{position:absolute;opacity:0;width:26px;height:26px;margin:0;cursor:pointer}
.check .box{flex:none;width:26px;height:26px;border-radius:8px;background:#f3f3f1;box-shadow:inset 0 1px 2px rgba(0,0,0,.1);position:relative}
.check input:checked+.box{background:#3a3a3a;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.check input:checked+.box::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.check input:focus-visible+.box{box-shadow:0 0 0 4px rgba(0,0,0,.12)}
.check span:last-child{padding-top:2px}
button{display:block;width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-weight:650;font-size:18px;color:#fff;background:#1f6f5c;box-shadow:0 6px 16px rgba(31,111,92,.28);cursor:pointer;-webkit-appearance:none;appearance:none;outline:0}
button:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(31,111,92,.28)}
button:focus-visible{box-shadow:0 0 0 4px rgba(31,111,92,.25),0 6px 16px rgba(31,111,92,.28)}
button:disabled{opacity:.6;cursor:default}
.err{color:#444;min-height:1.4em;font-size:15px;font-weight:600;margin:0 0 8px}
.tick{width:56px;height:56px;line-height:56px;margin:0 auto 12px;border-radius:50%;background:#f3f3f1;font-size:28px;color:#333;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.foot{text-align:center;font-size:13px;margin-top:22px}
[hidden]{display:none!important}
.hp{display:none}
</style></head><body><main id="root"><section class="card center"><h1>Loading…</h1></section></main>
<script>window.__CFG={"url":"https://tdbexgliujscyyvrctcc.supabase.co","key":"sb_publishable_zzAkcepP9LTCb54ESZlYSw_c4zToVx-"};window.__CONTRACTS={"gurjeet-2026-10":{"id":"gurjeet-2026-10","version":"1","title":"Fixed-Term Services Agreement","consultant":"Gurjeet Gill","start":"2026-10-20","end":"2026-11-19","termLabel":"one calendar month","feeGBP":2000,"noticeDays":7,"services":[["Strategy","helping set business priorities, goals and plans for growth."],["Admin improvement","reviewing and improving day-to-day administration, processes and record-keeping."],["New product and services development","researching, developing and helping launch new products and services."]],"pdf":"gurjeet-2026-10.pdf"}};</script>
<script>(function () {
  var CFG = window.__CFG, CONTRACTS = window.__CONTRACTS;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (iso, o) { return new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: 'UTC' }, o)).format(new Date(iso + 'T12:00:00Z')); };
  var longDate = function (iso) { return fmt(iso, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(/^(\w+),/, '$1'); };
  var shortDate = function (iso) { return fmt(iso, { day: 'numeric', month: 'long', year: 'numeric' }); };
  var money = function (n) { return '£' + Number(n).toLocaleString('en-GB'); };
  var ukWhen = function (iso) {
    var d = new Date(iso), z = { timeZone: 'Europe/London' };
    return new Intl.DateTimeFormat('en-GB', Object.assign({ day: 'numeric', month: 'long', year: 'numeric' }, z)).format(d) + ' at ' +
      new Intl.DateTimeFormat('en-GB', Object.assign({ hour: '2-digit', minute: '2-digit' }, z)).format(d) + ' (UK time)';
  };

  function body(c) {
    var s = c.services.map(function (x) { return '<li><strong>' + esc(x[0]) + ':</strong> ' + esc(x[1]) + '</li>'; }).join('');
    return '<h2>1. Parties</h2><p>This agreement is made on the date it is signed electronically below, between:</p>' +
      '<p><strong>Client:</strong> <span id="live" data-empty="the person who signs below">the person who signs below</span> (the “Client”); and</p>' +
      '<p><strong>Consultant:</strong> ' + esc(c.consultant) + ' (the “Consultant”).</p>' +
      '<h2>2. Term</h2><p>This agreement starts on ' + longDate(c.start) + ' and ends on ' + longDate(c.end) + ' (' + esc(c.termLabel) + '), unless ended early under section 7. It does not renew automatically. Any further month of work will be covered by a new written agreement, issued by mutual agreement.</p>' +
      '<h2>3. Role and services</h2><p>The Consultant will provide the following services to the Client:</p><ul>' + s + '</ul><p>Specific tasks and priorities will be agreed between the parties from time to time.</p>' +
      '<h2>4. Fee and payment</h2><p>The Client will pay the Consultant a fixed fee of ' + money(c.feeGBP) + ' for the month. The fee is due at the end of the term and must be paid by ' + longDate(c.end) + ' by bank transfer to the account the Consultant provides.</p>' +
      '<h2>5. Hours and flexibility</h2><p>There are no fixed working hours. The Consultant will work flexibly, at times and places agreed between the parties, as reasonably needed to deliver the services.</p>' +
      '<h2>6. Confidentiality</h2><p>The Consultant will keep confidential any non-public information about the Client’s business, customers, finances and plans, and will use it only to provide the services. This continues after the agreement ends.</p>' +
      '<h2>7. Ending early</h2><p>Either party may end this agreement early by giving ' + c.noticeDays + ' days’ written notice (email is acceptable). If it ends early, the fee will be reduced pro rata to the number of days worked in the term, and the amount due will be paid within ' + c.noticeDays + ' days of the end date.</p>' +
      '<h2>8. Tax</h2><p>Unless the parties agree otherwise in writing, the Consultant is responsible for their own income tax and National Insurance on the fee, and the fee is paid without deductions.</p>' +
      '<h2>9. Governing law</h2><p>This agreement is governed by the law of England and Wales, and the courts of England and Wales have exclusive jurisdiction.</p>' +
      '<h2>10. Electronic signature</h2><p>The Client signs by typing their name and selecting “I agree” on the signing page. The Consultant agrees to these terms by issuing this agreement. The date and time of signing are recorded automatically.</p>';
  }

  function rpc(fn, args) {
    return fetch(CFG.url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    }).then(function (r) { return r.text().then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { j = null; } if (!r.ok) { var e = new Error('rpc'); e.status = r.status; e.body = j; throw e; } return j; }); });
  }

  var root = $('root');
  function msg(title, text) { root.innerHTML = '<section class="card center"><h1>' + esc(title) + '</h1><p class="muted">' + esc(text) + '</p></section>'; }

  var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  var dot = h.indexOf('.');
  var id = dot > 0 ? h.slice(0, dot) : '', token = dot > 0 ? h.slice(dot + 1) : '';
  var c = CONTRACTS[id];
  if (!c || !token) return msg('Link not valid', 'Please check the link you were sent, or ask Gurjeet for a new one.');
  document.title = c.title + ' – ' + c.consultant;
  msg('Loading…', 'One moment.');

  rpc('get_contract_status', { p_contract_id: id, p_token: token }).then(function (signedAt) {
    render(signedAt);
  }, function (e) {
    if (e && e.status === 403 || (e && e.body && e.body.code === '42501')) msg('Link not valid', 'Please check the link you were sent, or ask Gurjeet for a new one.');
    else msg('Temporarily unavailable', 'Sorry, this page can’t load right now. Please try again in a few minutes.');
  });

  function render(signedAt) {
    var head = '<header><p class="eyebrow">' + esc(c.consultant) + '</p><h1>' + esc(c.title) + '</h1><p class="muted">Monthly contract: ' + shortDate(c.start) + ' to ' + shortDate(c.end) + '</p></header>' +
      '<section class="card facts"><div><span class="muted">Fee</span><strong>' + money(c.feeGBP) + '</strong></div><div><span class="muted">Term</span><strong>' + esc(c.termLabel) + '</strong></div></section>' +
      '<article class="card contract">' + body(c) + '</article>' +
      '<p class="center"><a class="link" href="' + esc(c.pdf) + '" download>Download the contract as a PDF</a></p>';
    var action;
    if (signedAt) {
      action = '<section class="card center" id="done"><div class="tick" aria-hidden="true">✓</div><h2>Already signed</h2><p>This contract was signed on <strong>' + esc(ukWhen(signedAt)) + '</strong>. Nothing more to do.</p></section>';
    } else {
      action = '<section class="card" id="formcard"><h2>Sign this contract</h2><form id="f" novalidate autocomplete="on">' +
        '<label>Full name <span class="req">required</span><input id="name" type="text" autocomplete="name" maxlength="200"></label>' +
        '<label>Business name <span class="opt">optional</span><input id="business" type="text" autocomplete="organization" maxlength="200"></label>' +
        '<label>Address <span class="opt">optional</span><textarea id="address" rows="3" autocomplete="street-address" maxlength="500"></textarea></label>' +
        '<label class="check"><input type="checkbox" id="agree"><span class="box"></span><span>I have read and agree to this contract</span></label>' +
        '<p class="err" id="err" role="alert"></p><button type="submit" id="go">I agree</button></form></section>' +
        '<section class="card center" id="thanks" hidden><div class="tick" aria-hidden="true">✓</div><h2>Thank you, it’s signed</h2><p>Your agreement has been recorded and ' + esc(c.consultant) + ' will get a copy.</p><p class="muted" id="when"></p></section>';
    }
    root.innerHTML = head + action + '<p class="foot muted">Contract reference: ' + esc(c.id) + ' · version ' + esc(c.version) + '</p>';
    if (!signedAt) wire();
  }

  function wire() {
    var live = $('live');
    function upd() {
      var n = $('name').value.trim(), b = $('business').value.trim(), a = $('address').value.trim(), t = n || live.getAttribute('data-empty');
      if (n && b) t += ', trading as ' + b;
      if (n && a) t += ', of ' + a.replace(/\s*\n\s*/g, ', ');
      live.textContent = t;
    }
    ['name', 'business', 'address'].forEach(function (k) { $(k).addEventListener('input', upd); });
    var busy = false;
    $('f').addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;
      var err = $('err'); err.textContent = '';
      if ($('name').value.trim().length < 2) { err.textContent = 'Please type your full name.'; $('name').focus(); return; }
      if (!$('agree').checked) { err.textContent = 'Please tick the box to confirm you agree.'; return; }
      busy = true; var btn = $('go'); btn.disabled = true; btn.textContent = 'Signing…';
      rpc('sign_contract', { p_contract_id: id, p_token: token, p_name: $('name').value, p_business: $('business').value, p_address: $('address').value, p_user_agent: navigator.userAgent })
        .then(function (j) {
          $('formcard').hidden = true; $('thanks').hidden = false;
          if (j.status === 'already') { $('thanks').querySelector('h2').textContent = 'Already signed'; $('thanks').querySelector('p').textContent = 'This contract had already been signed.'; }
          $('when').textContent = 'Signed ' + ukWhen(j.signed_at);
          $('thanks').scrollIntoView({ behavior: 'smooth', block: 'center' });
        })
        .catch(function () { busy = false; btn.disabled = false; btn.textContent = 'I agree'; err.textContent = 'Sorry, that didn’t go through. Please check your connection and try again.'; });
    });
  }
})();
</script></body></html>
